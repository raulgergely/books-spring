<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleas.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <table>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Publisher</th>
        </tr>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}">124</td>
            <td th:text="${book.title}">Spr</td>
            <td th:text="${book.publisher.publisherName}">Wrox</td>
        </tr>
    </table>
</body>
</html>
